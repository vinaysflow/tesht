version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tesht-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tesht}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tesht_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tesht}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesht"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: tesht-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/tesht-realm.json:/opt/keycloak/data/import/tesht-realm.json:ro
    command: ["start-dev", "--http-port=8080", "--import-realm"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tesht-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tesht}:${POSTGRES_PASSWORD:-tesht_dev_password}@postgres:5432/${POSTGRES_DB:-tesht}
      API_SECRET_KEY: ${API_SECRET_KEY}
      TESHT_DOMAIN: ${TESHT_DOMAIN:-localhost%3A5000}
      TESHT_SCHEME: ${TESHT_SCHEME:-http}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5051}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      DEMO_MODE: ${DEMO_MODE:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/tesht}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-tesht-api}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-tesht-api}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/tesht/protocol/openid-connect/certs}
    ports:
      - "5051:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tesht-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5051
    ports:
      - "6080:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  mock-mcp-server:
    build:
      context: .
      dockerfile: gateway/Dockerfile.mock
    container_name: tesht-mock-mcp
    ports:
      - "9100:9100"

  sqlite-mcp-server:
    build:
      context: .
      dockerfile: gateway/Dockerfile.sqlite-mcp
    container_name: tesht-sqlite-mcp
    ports:
      - "9102:9102"

  tesht-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: tesht-gateway
    ports:
      - "5052:5052"
    depends_on:
      mock-mcp-server:
        condition: service_started
      sqlite-mcp-server:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./gateway/config.yaml:/app/gateway/config.yaml
    environment:
      GATEWAY_CONFIG: /app/gateway/config.yaml
      PYTHONPATH: /app/sdk/python:/app
      DATABASE_URL: postgresql://${POSTGRES_USER:-tesht}:${POSTGRES_PASSWORD:-tesht_dev_password}@postgres:5432/${POSTGRES_DB:-tesht}

  mock-oidc-provider:
    build:
      context: .
      dockerfile: idp_bridge/Dockerfile.mock-oidc
    container_name: tesht-mock-oidc
    ports:
      - "9200:9200"

  tesht-idp-bridge:
    build:
      context: .
      dockerfile: idp_bridge/Dockerfile
    container_name: tesht-idp-bridge
    ports:
      - "5053:5053"
    depends_on:
      - mock-oidc-provider
    volumes:
      - ./idp_bridge/config.yaml:/app/idp_bridge/config.yaml
    environment:
      IDP_BRIDGE_CONFIG: /app/idp_bridge/config.yaml
      PYTHONPATH: /app/sdk/python:/app

volumes:
  postgres_data:
