[project]
name = "tesht"
version = "0.3.0"
description = "Tesht (Pramana) — portable identity and scoped authorization for AI agents (W3C DIDs, VCs, AP2)"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.9"
authors = [{ name = "Tesht (Pramana)" }]
keywords = ["ai-agents", "did", "verifiable-credentials", "zero-trust", "identity", "spiffe"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]
dependencies = [
    "cryptography>=43",
    "PyJWT[crypto]>=2.8",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/vinaysflow/tesht"
Documentation = "https://github.com/vinaysflow/tesht"
Repository = "https://github.com/vinaysflow/tesht"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.setuptools.packages.find]
include = ["tesht*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
